<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#142b32"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><title>구슬 미로 · 0.2.2</title><style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#142b32;color:#fff;font-family:system-ui,sans-serif}main{height:100dvh;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;flex-shrink:0;font-size:16px}h1{font-size:18px;margin:0}#clock{font-variant-numeric:tabular-nums}.board{flex:1;min-height:0;position:relative;display:flex;align-items:center;justify-content:center;container-type:size;overflow:hidden}canvas{width:100%;height:100%;display:block;touch-action:none}footer{flex-shrink:0;padding:8px 14px 12px}#hint{font-size:14px;color:#c5d7d9;text-align:center;margin:0 0 8px}.buttons{display:flex;justify-content:center;gap:10px}button{font:inherit;min-height:44px;border:1px solid #ffffff30;border-radius:12px;background:#29434b;color:#fff;padding:10px 18px}button:focus-visible{outline:3px solid #ffd172}button.primary{background:#f4bc5e;color:#242820;font-weight:700}button:disabled{opacity:.6}.overlay{position:fixed;inset:0;background:#142b32f5;display:flex;align-items:center;justify-content:center;text-align:center;padding:24px;z-index:5}.overlay[hidden]{display:none}.overlay h2{font-size:30px}.overlay p{font-size:16px;line-height:1.6;max-width:340px}.overlay small{font-size:13px;color:#b3c8ca}#gate{z-index:10}@media(orientation:landscape) and (max-height:500px){header{padding:4px 14px}footer{padding:4px 12px}#hint{display:none}}
</style><main><header><h1>구슬 미로</h1><span id="clock">0.0초</span></header><div class="board"><canvas id="game" width="1000" height="1000" aria-label="휴대폰 기울기로 조작하는 구슬 미로"></canvas></div><footer><p id="hint" role="status">검은 구멍을 피해 아래쪽 도착 지점까지!</p><div class="buttons"><button id="calibrate">중심 맞추기</button><button id="reset">처음부터</button></div></footer></main><div id="result" class="overlay" hidden><div><h2>도착했어!</h2><p id="score"></p><button class="primary" id="again">한 번 더</button></div></div><div id="gate" class="overlay"><div><h2>구슬 미로</h2><p id="message" role="status">휴대폰을 편하게 들고 시작해봐.<br>기울이면 구슬이 굴러가!</p><button class="primary" id="begin">시작하기</button><p><small>실제 구슬 소리 · 구멍 함정 4개<br>v0.2.2</small></p></div></div><script src="audio-recordings.js?v=0.2.2"></script><script>
'use strict';
const canvas=document.querySelector('#game'),ctx=canvas.getContext('2d'),hint=document.querySelector('#hint'),clock=document.querySelector('#clock'),result=document.querySelector('#result');
const W=500,H=800,R=10,goal={x:452,y:752},start={x:48,y:48};
// Thin cardboard partitions. Alternating openings make a continuous route.
const walls=[[0,0,500,14],[0,H-14,500,14],[0,0,14,H],[486,0,14,H]];
for(let i=0;i<6;i++){const y=110+i*100;walls.push(i%2===0?[14,y,370,10]:[116,y,370,10]);}
const traps=Array.from({length:4},(_,i)=>({x:i%2===0?280:220,y:165+i*100,r:19}));
let cameraY=0,viewHeight=500,fall=null,fallCount=0;
let ball,elapsed,won,active,last=0,accumulator=0,sensor={x:0,y:0},neutral=null,motion=false,paused=true,filtered={x:0,y:0},travelSpeed=0,lastSensorAt=0;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function reset(){filtered={x:0,y:0};travelSpeed=0;ball={...start,vx:0,vy:0};cameraY=0;fall=null;fallCount=0;elapsed=0;won=false;active=false;accumulator=0;result.hidden=true;clock.textContent='0.0초';rollVolume(0);}
function collide(b,w){const [x,y,width,height]=w;let dx=b.x-clamp(b.x,x,x+width),dy=b.y-clamp(b.y,y,y+height),d=Math.hypot(dx,dy);if(d>=R)return;if(d===0){const sides=[{d:b.x-x,nx:-1,ny:0},{d:x+width-b.x,nx:1,ny:0},{d:b.y-y,nx:0,ny:-1},{d:y+height-b.y,nx:0,ny:1}].sort((a,b)=>a.d-b.d);const s=sides[0];dx=s.nx;dy=s.ny;b.x+=dx*(R+s.d);b.y+=dy*(R+s.d);}else{dx/=d;dy/=d;b.x+=dx*(R-d);b.y+=dy*(R-d);}const dot=b.vx*dx+b.vy*dy;if(dot<0){impact(-dot);const bounce=-dot>25?.12:0;b.vx-=(1+bounce)*dot*dx;b.vy-=(1+bounce)*dot*dy;}}
function step(dt){if(won)return;travelSpeed=0;if(fall){if(paused)return;fall.t+=dt;if(fall.t>=.65){fall=null;ball={...start,vx:0,vy:0};cameraY=0;active=false;hint.textContent='다시 출발! 검은 구멍을 피해가자.';}return;}if(!motion||paused||!neutral)return;if(performance.now()-lastSensorAt>500)sensor={x:0,y:0};const smooth=1-Math.exp(-dt/.045);filtered.x+=(sensor.x-filtered.x)*smooth;filtered.y+=(sensor.y-filtered.y)*smooth;let x=filtered.x,y=filtered.y;const len=Math.hypot(x,y);if(len>1){x/=len;y/=len;}if(Math.hypot(x,y)>.015)active=true;if(!active)return;elapsed+=dt;const drag=Math.hypot(x,y)<.025?6:2.8;ball.vx=(ball.vx+x*360*dt)*Math.exp(-drag*dt);ball.vy=(ball.vy+y*360*dt)*Math.exp(-drag*dt);const speed=Math.hypot(ball.vx,ball.vy);if(speed>150){ball.vx*=150/speed;ball.vy*=150/speed;}const oldX=ball.x,oldY=ball.y;ball.x+=ball.vx*dt;ball.y+=ball.vy*dt;for(let j=0;j<2;j++)for(const w of walls)collide(ball,w);travelSpeed=Math.hypot(ball.x-oldX,ball.y-oldY)/dt;for(const h of traps){if(Math.hypot(ball.x-h.x,ball.y-h.y)<h.r-R*.3){fall={x:h.x,y:h.y,t:0};fallCount++;ball.vx=ball.vy=0;rollVolume(0);impact(110);hint.textContent='구멍에 빠졌어! 출발점으로 돌아갈게.';return;}}if(Math.hypot(ball.x-goal.x,ball.y-goal.y)<16){won=true;ball.vx=ball.vy=0;document.querySelector('#score').textContent=elapsed.toFixed(1)+'초 · 함정 '+fallCount+'회 · 미로 통과!';result.hidden=false;}}
function circle(x,y,r,fill){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();}
function polygon(points,color){ctx.beginPath();points.forEach(([x,y],i)=>i?ctx.lineTo(x,y):ctx.moveTo(x,y));ctx.closePath();ctx.fillStyle=color;ctx.fill();}
function drawWall(w){const [x,y,width,height]=w,dx=-4,dy=-8;
 ctx.save();ctx.shadowColor='#30201160';ctx.shadowBlur=7;ctx.shadowOffsetX=5;ctx.shadowOffsetY=7;ctx.fillStyle='#65462e';ctx.fillRect(x,y,width,height);ctx.restore();
 polygon([[x,y+height],[x+width,y+height],[x+width+dx,y+height+dy],[x+dx,y+height+dy]],'#8b603b');
 polygon([[x+width,y],[x+width,y+height],[x+width+dx,y+height+dy],[x+width+dx,y+dy]],'#61412b');
 const top=ctx.createLinearGradient(x,y+dy,x,y+height+dy);top.addColorStop(0,'#ead1a0');top.addColorStop(1,'#bc915c');ctx.fillStyle=top;ctx.fillRect(x+dx,y+dy,width,height);
 ctx.strokeStyle='#fff0c780';ctx.lineWidth=.7;ctx.strokeRect(x+dx+.4,y+dy+.4,width-.8,height-.8);
}
function drawBall(){ctx.save();if(fall){const q=Math.min(fall.t/.4,1),scale=Math.max(.03,1-q);ctx.translate(fall.x,fall.y);ctx.scale(scale,scale);ctx.translate(-ball.x,-ball.y);ctx.globalAlpha=1-q;}ctx.save();ctx.translate(ball.x,ball.y);ctx.scale(1,.7);circle(3,7,R+2,'#35251650');ctx.restore();const g=ctx.createRadialGradient(ball.x-4,ball.y-5,1,ball.x,ball.y-2,R);g.addColorStop(0,'#ffffff');g.addColorStop(.24,'#d6e8ed');g.addColorStop(.52,'#789cae');g.addColorStop(.8,'#355469');g.addColorStop(1,'#152f42');circle(ball.x,ball.y-2,R,g);circle(ball.x-3.5,ball.y-6,2,'#ffffffbc');ctx.restore();}
function draw(){const rect=canvas.getBoundingClientRect(),dpr=Math.min(window.devicePixelRatio||1,2);const cw=Math.max(1,Math.round(rect.width*dpr)),ch=Math.max(1,Math.round(rect.height*dpr));if(canvas.width!==cw||canvas.height!==ch){canvas.width=cw;canvas.height=ch;}const scale=Math.min(cw/W,ch/600);viewHeight=ch/scale;const maxCamera=Math.max(0,H-viewHeight);const upper=cameraY+viewHeight*.22,lower=cameraY+viewHeight*.78;if(ball.y>lower)cameraY=ball.y-viewHeight*.78;else if(ball.y<upper)cameraY=ball.y-viewHeight*.22;cameraY=clamp(cameraY,0,maxCamera);ctx.setTransform(1,0,0,1,0,0);ctx.clearRect(0,0,cw,ch);ctx.setTransform(scale,0,0,scale,(cw-W*scale)/2,-cameraY*scale);const floor=ctx.createLinearGradient(0,0,500,500);floor.addColorStop(0,'#e8cfa0');floor.addColorStop(.65,'#d6b77f');floor.addColorStop(1,'#b89461');ctx.fillStyle=floor;ctx.fillRect(0,0,W,Math.max(H,viewHeight));ctx.strokeStyle='#76533114';ctx.lineWidth=.65;for(let i=20;i<H;i+=6){ctx.beginPath();ctx.moveTo(14,i);ctx.bezierCurveTo(160,i-2,340,i+3,486,i);ctx.stroke();}
 const shade=ctx.createLinearGradient(0,14,0,37);shade.addColorStop(0,'#452e3655');shade.addColorStop(1,'#452e3600');ctx.fillStyle=shade;ctx.fillRect(14,14,472,23);
 circle(start.x,start.y,19,'#ab8b5745');ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillStyle='#5c452c';ctx.fillText('출발',48,79);
 circle(goal.x,goal.y,25,'#af955f');circle(goal.x,goal.y+1,22,'#236354');const hole=ctx.createRadialGradient(goal.x,goal.y+5,2,goal.x,goal.y,19);hole.addColorStop(0,'#122825');hole.addColorStop(1,'#081b19');circle(goal.x,goal.y,18,hole);ctx.fillStyle='#e1f4dd';ctx.fillText('도착',goal.x,goal.y+4);
 // Elevated wall silhouettes occlude the sphere wherever their projections overlap.
 for(const h of traps){circle(h.x,h.y+1,h.r+3,'#b89868');const g=ctx.createRadialGradient(h.x,h.y+5,1,h.x,h.y,h.r);g.addColorStop(0,'#060b0a');g.addColorStop(.72,'#17211d');g.addColorStop(1,'#554631');circle(h.x,h.y,h.r,g);ctx.beginPath();ctx.arc(h.x,h.y,h.r,-Math.PI,0);ctx.strokeStyle='#352919';ctx.lineWidth=2;ctx.stroke();}
 drawBall();for(const w of [...walls].sort((a,b)=>(a[1]+a[3])-(b[1]+b[3])))drawWall(w);
}
function frame(t){if(!document.hidden){accumulator+=Math.min((t-last)/1000,.05);while(accumulator>=1/120){step(1/120);accumulator-=1/120;}rollVolume(won||paused?0:travelSpeed);draw();clock.textContent=elapsed.toFixed(1)+'초';}last=t;requestAnimationFrame(frame);}

let audioCtx,lastImpact=-1,tapBuffer,rollBuffer,rollGain,rollSource,audioReady;
function initAudio(){const A=window.AudioContext||window.webkitAudioContext;if(!A)return Promise.reject(Error('audio'));if(!audioCtx)audioCtx=new A({latencyHint:'interactive'});audioCtx.resume().catch(()=>{});if(!audioReady){audioReady=(async()=>{const decode=async b=>{const raw=atob(b),bytes=new Uint8Array(raw.length);for(let i=0;i<raw.length;i++)bytes[i]=raw.charCodeAt(i);return audioCtx.decodeAudioData(bytes.buffer);};[rollBuffer,tapBuffer]=await Promise.all([decode(window.MAZE_AUDIO.roll),decode(window.MAZE_AUDIO.hit)]);})().catch(e=>{audioReady=null;throw e;});}return audioReady;}
function contact(buffer,volume){if(!audioCtx||!buffer||audioCtx.state!=='running'||volume<=0)return;const source=audioCtx.createBufferSource(),gain=audioCtx.createGain();source.buffer=buffer;gain.gain.value=volume;source.connect(gain).connect(audioCtx.destination);source.start();source.onended=()=>{source.disconnect();gain.disconnect();};}
function rollVolume(speed){if(!audioCtx||!rollBuffer)return;const moving=speed>5&&!paused&&!won&&!fall&&motion;if(!moving){if(rollSource){const src=rollSource,gain=rollGain,t=audioCtx.currentTime;gain.gain.cancelScheduledValues(t);gain.gain.setTargetAtTime(0,t,.008);src.stop(t+.035);rollSource=null;rollGain=null;}return;}if(!rollSource){rollSource=audioCtx.createBufferSource();rollSource.buffer=rollBuffer;rollSource.loop=true;rollGain=audioCtx.createGain();rollGain.gain.value=0;rollSource.connect(rollGain).connect(audioCtx.destination);const src=rollSource,gain=rollGain;src.onended=()=>{src.disconnect();gain.disconnect();};src.start();}rollGain.gain.setTargetAtTime(Math.min(speed/150,1)*.08,audioCtx.currentTime,.025);}
function impact(speed){if(!audioCtx||paused||!tapBuffer||speed<18||audioCtx.currentTime-lastImpact<.07)return;lastImpact=audioCtx.currentTime;contact(tapBuffer,Math.min(speed/150,1)*.4);}
const gate=document.querySelector('#gate'),message=document.querySelector('#message'),begin=document.querySelector('#begin');
let waiting;
// W3C Z-X-Y orientation converted to gravity. Trigonometric projection avoids angle wrap jumps.
function gravity(beta,gamma,angle){const b=beta*Math.PI/180,g=gamma*Math.PI/180,a=angle*Math.PI/180;const x=Math.cos(b)*Math.sin(g),y=Math.sin(b);return {x:x*Math.cos(a)+y*Math.sin(a),y:y*Math.cos(a)-x*Math.sin(a),z:Math.cos(b)*Math.cos(g)};}
function reference(g){const r=Math.hypot(g.x,g.z);const u=r>.001?{x:g.z/r,y:0,z:-g.x/r}:{x:1,y:0,z:0};const v={x:g.y*u.z-g.z*u.y,y:g.z*u.x-g.x*u.z,z:g.x*u.y-g.y*u.x};return {g,u,v};}
function project(g,n){const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;const dead=x=>Math.abs(x)<.012?0:Math.sign(x)*(Math.abs(x)-.012)/(.34-.012);return {x:clamp(dead(dot(g,n.u)),-1,1),y:clamp(dead(dot(g,n.v)),-1,1)};}
function orientation(e){if(!motion||paused||!Number.isFinite(e.beta)||!Number.isFinite(e.gamma))return;lastSensorAt=performance.now();const g=gravity(e.beta,e.gamma,screen.orientation?.angle??window.orientation??0);if(!neutral){neutral=reference(g);filtered={x:0,y:0};clearTimeout(waiting);gate.hidden=true;begin.disabled=false;hint.textContent='검은 구멍을 피해 아래쪽 도착 지점까지!';}sensor=project(g,neutral);}
window.addEventListener('deviceorientation',orientation);
function pause(){paused=true;filtered={x:0,y:0};travelSpeed=0;sensor={x:0,y:0};neutral=null;accumulator=0;rollVolume(0);clearTimeout(waiting);gate.hidden=false;message.textContent='편한 자세로 들고 이어하기를 눌러줘.';begin.textContent='이어하기';begin.disabled=false;}
document.addEventListener('visibilitychange',()=>{if(document.hidden)pause();});window.addEventListener('blur',()=>{if(gate.hidden)pause();});window.addEventListener('orientationchange',()=>{if(motion)pause();});
begin.onclick=async()=>{
 begin.disabled=true;message.textContent='기울기 권한을 허용해줘.';
 // Request all gesture-gated capabilities before awaiting a promise.
 let permission;try{const D=window.DeviceOrientationEvent;if(!D)throw Error('sensor');permission=typeof D.requestPermission==='function'?D.requestPermission():Promise.resolve('granted');}catch{message.textContent='기울기 센서가 있는 휴대폰에서 열어줘.';begin.disabled=false;return;}
 try{initAudio().catch(()=>{hint.textContent='녹음 소리를 불러오지 못했어. 새로고침해줘.';});}catch{hint.textContent='소리를 시작하지 못했어. 기울기 게임은 계속할 수 있어.';}
 if(document.documentElement.requestFullscreen&&!document.fullscreenElement)document.documentElement.requestFullscreen().catch(()=>{});
 try{if(await permission!=='granted')throw Error('permission');motion=true;paused=false;neutral=null;sensor={x:0,y:0};message.textContent='현재 자세를 맞추고 있어…';waiting=setTimeout(()=>{if(!neutral){paused=true;message.textContent='기울기 신호가 없어. 휴대폰 브라우저의 센서 권한을 확인하고 다시 눌러줘.';begin.disabled=false;}},4000);}catch{paused=true;message.textContent='기울기 권한이 필요해. 브라우저 설정에서 허용하고 다시 눌러줘.';begin.disabled=false;}
};
document.querySelector('#reset').onclick=()=>{reset();};document.querySelector('#calibrate').onclick=()=>{neutral=null;filtered={x:0,y:0};travelSpeed=0;sensor={x:0,y:0};ball.vx=ball.vy=0;rollVolume(0);};document.querySelector('#again').onclick=reset;reset();requestAnimationFrame(frame);
</script></html>
